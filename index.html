<!DOCTYPE html>
<html>
<head>
    <title>Fake News Detector</title>
</head>
<body style="text-align:center; font-family:Arial;">

    <h1>📰 Fake News Detector</h1>

    <form method="POST">
        <textarea name="news" rows="6" cols="50" placeholder="Enter news text here..."></textarea><br><br>
        <button type="submit">Check</button>
    </form>

    {% if prediction %}
        <h2>{{ prediction }}</h2>
    {% endif %}

</body>
</html>
